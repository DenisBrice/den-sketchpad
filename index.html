<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketchpad">
<meta name="theme-color" content="#1f2b33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Den Sketchpad</title>
<style>
:root{
  --ink:#1c1a18; --bg:#1f2b33; --bg2:#26353f; --cream:#f4ecdb; --cream2:#e8dcc3; --cream3:#d9cbad;
  --muted:#7d7160; --orange:#f08a3c; --teal:#2a9d8f; --rose:#e06c75; --sun:#f2c14e; --rec:#d7263d;
  --sh:3px 3px 0 var(--ink); --sh2:2px 2px 0 var(--ink);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--ink);background:var(--cream);border:2px solid var(--ink);
  border-radius:7px;box-shadow:var(--sh2);padding:0 12px;height:38px;min-width:38px;cursor:pointer;letter-spacing:.04em}
button:active{transform:translate(2px,2px);box-shadow:none}
button.on{background:var(--sun)}
button:disabled{opacity:.4}
.lamp{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.grm{display:flex;align-items:center;gap:6px;margin-top:8px;font:700 10px var(--mono)}.grm i{flex:1;height:8px;background:#1c1a18;border-radius:3px;position:relative;overflow:hidden}.grm i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:calc(var(--g,0)*100%);background:#e06c75}.grm b{width:30px;text-align:right}
.lamp::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#8a7f6d}
.lamp.on::before{background:var(--lampc,#ffd84a);box-shadow:0 0 8px var(--lampc,#ffd84a)}
.lamp.on{background:var(--cream)}
/* header */
#top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ink);border-bottom:3px solid #000;flex-wrap:nowrap}
#logo{image-rendering:pixelated;flex:none;cursor:pointer}
.tgroup{display:flex;gap:6px;align-items:center}
#bPlay,#bRec,#bHome{width:50px;height:44px;font-size:18px;padding:0}
#bRec{color:var(--rec)}
#bRec.on{background:var(--rec);color:var(--cream)}
#bPlay.on{background:var(--teal);color:var(--cream)}
#clock{font-family:var(--mono);background:#0e1316;color:#9ff0c9;border:2px solid #000;border-radius:7px;padding:3px 10px;min-width:150px;
  box-shadow:inset 0 0 0 1px #2f3d38;line-height:1.1}
#clock b{font-size:20px;display:block;letter-spacing:.04em}
#clock span{font-size:12px;color:#6fae94}
#bpmBox{display:flex;align-items:center;gap:4px;background:var(--cream);border:2px solid var(--ink);border-radius:7px;padding:2px 4px;box-shadow:var(--sh2);height:38px}
#bpmBox input{width:52px;font:700 17px var(--mono);border:0;background:transparent;text-align:center;color:var(--ink)}
#bpmBox small{font-size:10px;font-weight:800;color:var(--muted)}
#bpmBox select{border:0;background:transparent;font:700 13px var(--mono);color:var(--ink)}
.spacer{flex:1}
#projName{color:var(--cream);font-weight:700;font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
#recBadge{display:none;background:var(--rec);color:#fff;font:800 12px var(--mono);padding:4px 8px;border-radius:5px}
#recBadge.on{display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
/* toolbar */
#tools{display:flex;gap:7px;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:2px solid #000;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools button{height:34px;font-size:12px;flex:none}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:7px;overflow:hidden;box-shadow:var(--sh2);flex:none;background:var(--cream)}
.seg button{border:0;border-radius:0;box-shadow:none;height:30px;min-width:0;padding:0 9px;border-right:2px solid var(--ink);font-size:11px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--cream)}
.tlabel{color:var(--cream3);font:800 10px var(--sans);letter-spacing:.12em;flex:none}
/* main */
#main{flex:1;display:flex;min-height:0;position:relative}
#heads{width:176px;flex:none;background:var(--bg2);border-right:3px solid #000;overflow:hidden;position:relative}
#headsInner{position:absolute;left:0;right:0;top:114px}
#headTop{position:absolute;left:0;right:0;top:0;z-index:2;background:var(--bg2)}
.th.mh{height:64px;background:#2f2a1c;border-bottom:3px solid #000}.th.mh.sel{background:#4a4226}.th.mh .nm{color:#f2c14e;letter-spacing:.12em}
.th.mh .row button{height:24px;font-size:10px}.th.mh .bd{padding:4px 7px;gap:3px}.th.mh .nm{font-size:11px;line-height:14px}
#rulerPad{height:50px;background:var(--ink);border-bottom:2px solid #000;display:flex;align-items:center;justify-content:center;gap:6px}
#rulerPad button{height:24px;font-size:10px;padding:0 8px;box-shadow:none}
.th{height:92px;border-bottom:2px solid #11181d;display:flex;position:relative;background:var(--bg2)}
.th.sel{background:#32444f}
.th .col{width:8px;flex:none}
.th .bd{flex:1;padding:6px 7px;display:flex;flex-direction:column;gap:5px;min-width:0}
.th .nm{color:var(--cream);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.th .row{display:flex;gap:4px;align-items:center}
.th .row button{height:28px;min-width:30px;padding:0 6px;font-size:11px;box-shadow:none;border-width:2px}
.th .row button.m.on{background:var(--rose)}
.th .row button.s.on{background:var(--sun)}
.th .row button.r{color:var(--rec)}
.th .row button.r.on{background:var(--rec);color:#fff}
.th select{height:28px;border:2px solid var(--ink);border-radius:6px;background:var(--cream);font:700 11px var(--sans);padding:0 2px;color:var(--ink)}
.th canvas.mt{height:6px;width:100%;background:#0e1316;border-radius:3px}
#addTrack{margin:10px;width:calc(100% - 20px)}
#lanes{flex:1;position:relative;min-width:0;background:#182229}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* drawer */
#drawer{height:300px;flex:none;background:var(--bg2);border-top:3px solid #000;display:flex;flex-direction:column;transition:height .15s}
#drawer.closed{height:48px}
#dtabs{display:flex;gap:8px;align-items:center;padding:7px 12px}
#dbody{flex:1;overflow:auto;padding:4px 12px 14px;-webkit-overflow-scrolling:touch}
#drawer.closed #dbody{display:none}
.cards{display:flex;gap:14px;align-items:stretch;min-height:100%}
.card{background:var(--cream);border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:24px 12px 10px;position:relative;flex:none}
.card .tab{position:absolute;top:-2px;left:12px;transform:translateY(-50%);background:var(--ink);color:var(--cream);font:800 11px var(--sans);letter-spacing:.14em;padding:4px 9px;border-radius:5px}
.card .tab.c{background:var(--tc,var(--ink))}
.card .sw{position:absolute;top:6px;right:8px;height:26px;font-size:10px;padding:0 8px;box-shadow:none}
.knobs{display:flex;gap:8px;align-items:flex-start}
.knob{width:66px;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:ns-resize}
.knob svg{width:58px;height:58px}
.knob .klab{font:800 10px var(--sans);letter-spacing:.1em;margin-top:2px}
.knob .kval{font:700 11px var(--mono);color:var(--muted);height:14px}
.card.off .knobs{opacity:.45}
/* mixer */
.strip .sb{display:flex;gap:12px;align-items:flex-start}.strip .sc{display:flex;flex-direction:column;align-items:center;gap:5px}
.strip{width:124px;padding:20px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.strip .knob{width:52px}.strip .knob svg{width:42px;height:42px}.strip .knob .kval{height:12px}
.strip.sel{outline:3px solid var(--sun);outline-offset:2px}
.fader{width:44px;height:100px;position:relative;touch-action:none;cursor:ns-resize}
.fader .slot{position:absolute;left:19px;top:6px;bottom:6px;width:6px;background:var(--ink);border-radius:3px}
.fader .cap{position:absolute;left:4px;width:36px;height:20px;background:var(--ink);border-radius:4px;border:2px solid var(--ink);box-shadow:inset 0 -6px 0 #000}
.fader .cap::after{content:"";position:absolute;left:4px;right:4px;top:7px;height:2px;background:var(--fc,var(--orange))}
.fader canvas{position:absolute;right:-6px;top:6px;width:6px;height:88px;background:#0e1316;border-radius:2px}
.strip .db{font:700 11px var(--mono)}
.strip .row{display:flex;gap:4px}
.strip .row button{height:26px;min-width:28px;padding:0 5px;font-size:10px;box-shadow:none}
.strip .row button.m.on{background:var(--rose)}.strip .row button.s.on{background:var(--sun)}
.strip .nm{font:800 11px var(--sans);max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itembox{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.btncol{display:grid;grid-template-columns:repeat(3,auto);gap:8px}
.hint{color:var(--cream3);font-size:13px;padding:14px 4px;line-height:1.5}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,14,17,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal.on{display:flex}
#mbox{background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink);width:min(640px,100%);max-height:90vh;overflow:auto;padding:30px 20px 20px;position:relative}
#mbox h2{margin:0 0 12px;font-size:18px;letter-spacing:.06em}
#mbox h3{margin:18px 0 8px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
#mbox .x{position:absolute;right:12px;top:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:#fff8ea;border:2px solid var(--ink);border-radius:8px;padding:8px 10px}
.pitem.cur{background:var(--sun)}
.pitem div{flex:1;min-width:0}
.pitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{color:var(--muted);font-family:var(--mono)}
.grid2{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;line-height:1.5;color:#4b4236}
#toast{position:fixed;left:50%;bottom:310px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;border:2px solid var(--cream3)}
#toast.on{opacity:1}
input.txt{font:600 15px var(--sans);border:2px solid var(--ink);border-radius:7px;padding:8px 10px;width:100%;background:#fff8ea;color:var(--ink)}
@media (max-width:1000px){
  #projName{display:none}
  #heads{width:150px}
  #clock{min-width:118px}
  #clock b{font-size:17px}
}
@media (max-width:800px){
  #logo{display:none}
  .knob{width:58px}.knob svg{width:50px;height:50px}
}
.keysbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.keysbar .klab{flex:1;min-width:180px;color:#f4ecdb;font-size:12px}.keysbar .oct{font:700 12px var(--mono);color:#f4ecdb;min-width:26px;text-align:center}
canvas.keys{width:100%;height:150px;display:block;border-radius:8px;touch-action:none;background:#1c1a18;box-shadow:4px 4px 0 #000}
.rollcard{flex:1 1 560px;min-width:320px}.rollbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.rollbar button{height:32px;padding:0 10px;font-size:11px}
canvas.roll{width:100%;height:230px;display:block;border-radius:6px;touch-action:none}
.th .inst{font:800 11px -apple-system,sans-serif;height:30px;border-radius:6px;border:2px solid #1c1a18;padding:0 4px}
#addRow{display:flex;gap:8px;margin:10px}#addRow button{flex:1}
</style>
</head>
<body>
<div id="top">
  <canvas id="logo" width="172" height="30" title="Projects"></canvas>
  <div class="tgroup">
    <button id="bHome" title="Back to start">⏮</button>
    <button id="bPlay" title="Play / stop (space)">▶</button>
    <button id="bRec" title="Record (R)">●</button>
  </div>
  <div id="clock"><b id="ck1">1.1.00</b><span id="ck2">0:00.0</span></div>
  <div id="bpmBox"><small>BPM</small><input id="bpm" type="number" inputmode="decimal" min="30" max="300" step="1"><select id="bpb"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select><small>/4</small></div>
  <button id="bClick" class="lamp">CLICK</button>
  <button id="bCount" class="lamp">COUNT-IN</button>
  <button id="bLoop" class="lamp">LOOP</button>
  <span id="recBadge">REC 0:00</span>
  <div class="spacer"></div>
  <span id="projName"></span>
  <button id="bProj">PROJECT</button>
</div>
<div id="tools">
  <span class="tlabel">SNAP</span>
  <div class="seg" id="snapSeg"><button data-v="off">OFF</button><button data-v="16">1/16</button><button data-v="beat">BEAT</button><button data-v="bar">BAR</button></div>
  <button id="tSplit">SPLIT</button>
  <button id="tDup">DUPLICATE</button>
  <button id="tDel">DELETE</button>
  <button id="tUndo">UNDO</button>
  <button id="tRedo">REDO</button>
  <span class="tlabel">ZOOM</span>
  <button id="tZo">−</button><button id="tZi">+</button><button id="tFit">FIT</button>
  <button id="tRegion" title="Make a region from the time selection (drag along the ruler)">+ REGION</button>
  <button id="tImport">IMPORT AUDIO</button>
  <input id="fileIn" type="file" accept="audio/*,.wav,.aif,.aiff,.mp3,.m4a,.caf,.flac,.mid,.midi,audio/midi,audio/x-midi" multiple hidden>
</div>
<div id="main">
  <div id="heads"><div id="headsInner"></div><div id="headTop"></div></div>
  <div id="lanes"><canvas id="cv"></canvas></div>
</div>
<div id="drawer">
  <div id="dtabs">
    <div class="seg" id="dSeg"><button data-v="mix">MIX</button><button data-v="fx">FX</button><button data-v="item">ITEM</button><button data-v="keys">KEYS</button><button data-v="sect">SECTIONS</button></div>
    <span class="tlabel" id="dTitle"></span>
    <div class="spacer"></div>
    <button id="dToggle">HIDE</button>
  </div>
  <div id="dbody"></div>
</div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
const VERSION='0.5.1';
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dbLin=d=>d<=-60?0:Math.pow(10,d/20);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const COLORS=['#f08a3c','#2a9d8f','#e06c75','#f2c14e','#7b8cde','#8bbf6a','#c97bd6','#5fb7d4','#d9935c','#59b39a','#e891a3','#b9a64a'];
const ECHO_STEPS=[['1/16',.25],['1/8',.5],['1/8.',.75],['1/4',1],['1/4.',1.5],['1/2',2]];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let toastT=0;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2200)}
function fmtTime(t){const s=Math.max(0,t);const m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')}
function dateStr(){const d=new Date();return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toTimeString().slice(0,5)}
function safeName(s){return String(s).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'Sketch'}

/* ============================ storage ============================ */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('den-sketchpad',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('clips',{keyPath:'id'})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const r=fn(t.objectStore(st));let out;
    if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(st,v){return this.tx(st,'readwrite',s=>s.put(v))},
  get(st,k){return this.tx(st,'readonly',s=>s.get(k))},
  all(st){return this.tx(st,'readonly',s=>s.getAll())},
  del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))},
  keys(st){return this.tx(st,'readonly',s=>s.getAllKeys())}
};
const LS={get(k,d){try{const v=localStorage.getItem('denSketch.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('denSketch.'+k,JSON.stringify(v))}catch(e){}}};

/* ============================ model ============================ */
function defaultFx(){return{eq:{on:false,hp:20,low:0,mid:0,midF:900,high:0},comp:{on:false,amount:35,make:0},
  echo:{on:false,time:3,fb:35,tone:45,mix:25},haze:{on:false,size:55,tone:45,motion:40,mix:35},
  dcomp:{on:false,thr:-18},bloom:{on:false,size:60,decay:45,shimmer:0,motion:0,mix:35,freeze:false}}}
// older projects: add any FX they don't have yet
function fillFx(fx){const d=defaultFx();for(const k in d)if(!fx[k])fx[k]=d[k];return fx}
function newTrack(i){return{id:uid(),name:'Track '+(i+1),color:COLORS[i%COLORS.length],vol:0,pan:0,mute:false,solo:false,arm:false,input:'1',fx:defaultFx(),items:[]}}
function newProject(name){const p={id:uid(),name:name||('Sketch '+dateStr()),v:VERSION,bpm:90,bpb:4,created:Date.now(),modified:Date.now(),
  loop:{on:false,start:0,end:0},cursor:0,click:false,countIn:true,snap:'beat',zoom:60,scrollX:0,master:{vol:0,limit:true,fx:defaultFx()},markers:[],regions:[],tracks:[],clips:{}};
  for(let i=0;i<4;i++)p.tracks.push(newTrack(i));p.tracks[0].arm=true;p.loop.end=4*p.bpb*60/p.bpm;return p}
let proj=null;
const AUD=new Map(); // clipId -> {buf, peaks}
let sel={track:null,item:null};
function trackById(id){return proj.tracks.find(t=>t.id===id)}
// the master bus as a track-like object (its FX settings live in proj.master.fx)
function MT(ms){ms=ms||proj.master;if(!ms.fx)ms.fx=defaultFx();fillFx(ms.fx);return{id:'master',name:'MASTER',color:'#f2c14e',fx:ms.fx,vol:0,pan:0,mute:false,solo:false,isMaster:true,items:[]}}
function selTrack(){return sel.track==='master'?MT():(trackById(sel.track)||proj.tracks[0])}
function findItem(id){for(const t of proj.tracks){const it=t.items.find(i=>i.id===id);if(it)return{t,it}}return null}
function beatDur(){return 60/proj.bpm}
function barDur(){return beatDur()*proj.bpb}
function gridLen(){const s=proj.snap;return s==='16'?beatDur()/4:s==='beat'?beatDur():s==='bar'?barDur():0}
function snapT(t){const g=gridLen();return g?Math.round(t/g)*g:t}
function projEnd(){let e=0;for(const t of proj.tracks)for(const it of t.items)e=Math.max(e,it.pos+it.len);return e}

/* undo */
let undoS=[],redoS=[];
function snap(){return JSON.stringify({bpm:proj.bpm,bpb:proj.bpb,loop:proj.loop,tracks:proj.tracks,master:proj.master,markers:proj.markers,regions:proj.regions})}
function pushUndo(){undoS.push(snap());if(undoS.length>80)undoS.shift();redoS=[]}
function restore(s){Object.assign(proj,JSON.parse(s));if(sel.item&&!findItem(sel.item))sel.item=null;if(sel.track!=='master'&&!trackById(sel.track))sel.track=proj.tracks[0]&&proj.tracks[0].id;
  syncEngine();renderHeads();renderDrawer();uiTransport();dirty();save();reschedule()}
function undo(){if(!undoS.length)return toast('Nothing to undo');redoS.push(snap());restore(undoS.pop())}

function envPts(it){const L=it.len,g=dbLin(it.gain||0),fi=Math.min(it.fadeIn||0,L),fo=Math.min(it.fadeOut||0,L-fi);

  const s0=Math.max(it.pos,songFrom),s1=Math.min(it.pos+it.len,songTo);if(s1-s0<0.002)return;

const FXW=`// Den Sketchpad FX worklets: DEN COMP (Den 00 Comp v0.3.4, CLEAN style defaults) and BLOOM (Den Bloom Lite v0.1 core)
const TWO_PI=2*Math.PI;
const opa=(hz,sr)=>1-Math.exp(-TWO_PI*Math.min(hz,sr*0.45)/sr);

    this.env=0;this.g=1;this.gi=0;this.wg=1;this.eng=0;this.gr=0;this.cnt=0;
    const sr=sampleRate,tc=ms=>1-Math.exp(-1/(ms*0.001*sr)),tcr=ms=>1-Math.exp(-this.CR/(ms*0.001*sr));
    // CLEAN style, Den 00 Comp defaults: ratio 4, knee max(6,8)=8, attack 10 ms x1.5, release 120 ms, link 100, auto gain on
    this.slope=1-1/4;this.knee=8;this.aAtt=tcr(15);this.aRel=tcr(120);this.kRms=tc(8);this.rmsb=0.3;this.ksm=tcr(20);
    this.port.onmessage=e=>{const d=e.data;if(d.dead)this.dead=true;if(d.on!=null)this.on=!!d.on;if(d.thr!=null)this.thr=d.thr};}
  gc(o){const h=this.knee/2;return o<=-h?0:o>=h?o*this.slope:this.slope*(o+h)*(o+h)/(2*this.knee)}
  process(inp,out){if(this.dead)return false;const i=inp[0],o=out[0];if(!i||!i.length){return true}

    const wgT=db2g(this.gc(-this.thr)*0.4);
    for(let j=0;j<n;j++){const sL=L[j],sR=R[j];let aL=Math.abs(sL),aR=Math.abs(sR);

const INST={piano:{name:'PIANO',color:'#8fb8de',def:{tone:45,soft:45,release:60}},bass:{name:'BASS',color:'#b5835a',def:{tone:35,soft:20,release:35}}};

  const frz=el('button','lamp'+(t.fx.bloom.freeze?' on':''),'FREEZE');frz.style.cssText='height:30px;font-size:10px;padding:0 10px;margin-top:8px;--lampc:#c792ea';frz.onclick=()=>{const b=t.fx.bloom;b.freeze=!b.freeze;if(b.freeze&&!b.on){b.on=true;blc.classList.remove('off');blc.querySelector('.sw').classList.add('on')}frz.classList.toggle('on',b.freeze);applyTrack(t);dirty();save()};blc.appendChild(frz);
  if(A.ctx&&A.ctx._denfx===false){const w=el('div','hint','This browser can\'t run DEN COMP / BLOOM.');w.style.fontSize='11px';blc.appendChild(w)}
  row.appendChild(blc);
  if(t.isMaster){const mc=el('div','card');mc.style.background='#f2c14e';mc.innerHTML='<div class="tab">MASTER</div>';const col=el('div','btncol');col.style.gridTemplateColumns='auto';
    const lim=el('button','lamp'+(proj.master.limit?' on':''),'LIMIT');lim.onclick=()=>{proj.master.limit=!proj.master.limit;lim.classList.toggle('on',proj.master.limit);applyMaster(A.master,A.ctx,proj.master);renderHeads();dirty();save()};

    const fd=Knob({label:'VOLUME',min:-24,max:12,value:proj.master.vol,def:0,bipolar:true,color:'#1c1a18',fmt:v=>(v>0?'+':'')+v.toFixed(1),onChange:(v,end)=>{proj.master.vol=Math.round(v*10)/10;applyMaster(A.master,A.ctx,proj.master);if(end)save()}});

  const tc=el('div','card');tc.innerHTML='<div class="tab">TRACK</div>';const col=el('div','btncol');col.style.gridTemplateColumns='auto';
  const rn=el('button',null,'RENAME');rn.onclick=()=>{const n=prompt('Track name',t.name);if(n){pushUndo();t.name=n;renderHeads();renderDrawer();save()}};
  const cl=el('button',null,'COLOUR');cl.onclick=()=>{t.color=COLORS[(COLORS.indexOf(t.color)+1)%COLORS.length];renderHeads();renderDrawer();dirty();save()};

  const dl=el('button',null,'DELETE');dl.onclick=()=>deleteTrack(t);[rn,cl,rs,dl].forEach(x=>col.appendChild(x));tc.appendChild(col);row.appendChild(tc);
  b.appendChild(row)}
function renderItem(b){const s=selItem();if(!s){b.appendChild(el('div','hint','Tap an item on the timeline to select it.<br>Selected item: drag the middle to move (also to another track), drag the side tabs to trim, drag the round top handles to fade.<br>Tap empty space to set the cursor. Drag empty space to scroll. Pinch to zoom. Drag on the ruler to set a loop.'));return}
  const{t,it}=s;const box=el('div','itembox');
  if(it.notes){const c=el('div','card');c.innerHTML=`<div class="tab c" style="--tc:${t.color};color:#1c1a18">ITEM</div>`;
    c.appendChild(el('div',null,`<b>${esc(it.name||'item')}</b><br><small style="font-family:var(--mono);color:#7d7160">${it.notes.length} notes · start ${fmtTime(it.pos)} · ${it.len.toFixed(2)} s</small>`));

    const col=el('div','btncol');col.style.marginTop='8px';[['SPLIT',split],['DUPLICATE',duplicate],['DELETE',delItem],['RENAME',()=>{const n=prompt('Item name',it.name||'');if(n!=null){pushUndo();it.name=n;dirty();save();renderDrawer()}}]].forEach(([l,f])=>{const x=el('button',null,l);x.onclick=f;col.appendChild(x)});c.appendChild(col);
    box.appendChild(c);renderRoll(box,t,it);b.appendChild(box);return}const c=el('div','card');c.innerHTML=`<div class="tab c" style="--tc:${t.color};color:#1c1a18">ITEM</div>`;
  const nm=el('div',null,`<b>${esc(it.name||'item')}</b><br><small style="font-family:var(--mono);color:#7d7160">start ${fmtTime(it.pos)} · length ${it.len.toFixed(2)} s</small>`);nm.style.cssText='margin-bottom:8px;font-size:13px';c.appendChild(nm);
  const ks=el('div','knobs');let u=false;const pu=()=>{if(!u){pushUndo();u=true}};
  ks.appendChild(Knob({label:'GAIN',min:-24,max:24,value:it.gain||0,def:0,bipolar:true,color:t.color,fmt:v=>(v>0?'+':'')+v.toFixed(1),onChange:(v,end)=>{pu();it.gain=Math.round(v*10)/10;dirty();if(end){u=false;save();reschedule()}}}));
  ks.appendChild(Knob({label:'FADE IN',min:0,max:Math.min(10,it.len),value:it.fadeIn||0,def:0,color:t.color,fmt:v=>v.toFixed(2)+'s',onChange:(v,end)=>{pu();it.fadeIn=Math.min(v,it.len-(it.fadeOut||0));dirty();if(end){u=false;save();reschedule()}}}));
  ks.appendChild(Knob({label:'FADE OUT',min:0,max:Math.min(10,it.len),value:it.fadeOut||0,def:0,color:t.color,fmt:v=>v.toFixed(2)+'s',onChange:(v,end)=>{pu();it.fadeOut=Math.min(v,it.len-(it.fadeIn||0));dirty();if(end){u=false;save();reschedule()}}}));
  c.appendChild(ks);box.appendChild(c);
  const a=el('div','card');a.innerHTML='<div class="tab">EDIT</div>';const col=el('div','btncol');
  [['SPLIT',split],['DUPLICATE',duplicate],['DELETE',delItem],['REVERSE',reverseItem],['NORMALISE',normalise],['RENAME',()=>{const n=prompt('Item name',it.name||'');if(n!=null){pushUndo();it.name=n;dirty();save();renderDrawer()}}]].forEach(([l,f])=>{const x=el('button',null,l);x.onclick=f;col.appendChild(x)});
  a.appendChild(col);box.appendChild(a);b.appendChild(box)}

/* ============================ project modal ============================ */
function openModal(html){$('#mbox').innerHTML='<button class="x">CLOSE</button>'+html;$('#modal').classList.add('on');$('#mbox .x').onclick=closeModal}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});
async function projectMenu(){const all=(await DB.all('projects')).sort((a,b)=>b.modified-a.modified);
  const lat=Math.round(latency()*1000),man=LS.get('latency',null);
  openModal(`<h2>DEN SKETCHPAD <small style="font-weight:600;color:#7d7160">v${VERSION}</small></h2>
  <h3>THIS PROJECT</h3><div class="grid2"><button id="pRen">RENAME</button><button id="pZip">SAVE ZIP (for REAPER)</button><button id="pZipM">ZIP + MIXDOWN</button><button id="pMix" style="background:#f2c14e">EXPORT MIX…</button></div>
  <p class="note">SAVE ZIP opens the share sheet: pick <b>Save to Files</b>, then Dropbox (e.g. Dropbox/REAPER/_SKETCHES). At home, run <b>Den Sketchpad Import</b> in REAPER and pick the zip.</p>
  <h3>PROJECTS ON THIS IPAD</h3><div class="plist" id="pList"></div>
  <div class="grid2" style="margin-top:10px"><button id="pNew">NEW PROJECT</button><button id="pImp">OPEN A SKETCH ZIP</button><input id="zipIn" type="file" accept=".zip,application/zip" hidden></div>
  <h3>SETTINGS</h3>
  <div class="grid2" style="align-items:center"><span class="note">Recording latency fix (ms):</span><input id="sLat" class="txt" style="width:90px" inputmode="numeric" value="${man!=null?man:''}" placeholder="${lat}"><span class="note">blank = auto (${lat} ms). Raise it if recordings land late, lower if early.</span></div>
  <div class="grid2" style="align-items:center;margin-top:8px"><span class="note">Click volume:</span><input id="sClk" type="range" min="0" max="1" step="0.05" value="${LS.get('clickVol',0.35)}"></div>
  <h3>OFFLINE</h3><p class="note" id="offNote">Install: in Safari tap Share, then <b>Add to Home Screen</b>. Open it from the Home Screen once while online; after that it works with no internet. Projects live on this iPad, so save zips to Dropbox now and then as a backup.</p>`);
  const L=$('#pList');for(const p of all){const d=el('div','pitem'+(p.id===proj.id?' cur':''),`<div><b>${esc(p.name)}</b><small>${new Date(p.modified).toLocaleString()} · ${p.tracks.reduce((a,t)=>a+t.items.length,0)} items · ${p.bpm} bpm</small></div>`);
    if(p.id!==proj.id){const o=el('button',null,'OPEN');o.onclick=async()=>{closeModal();await openProject(p.id)};d.appendChild(o)}
    const del=el('button',null,'DELETE');del.onclick=async()=>{if(!confirm('Delete "'+p.name+'" from this iPad? (zips you saved are not touched)'))return;await deleteProject(p.id);projectMenu()};d.appendChild(del);L.appendChild(d)}
  $('#pRen').onclick=()=>{const n=prompt('Project name',proj.name);if(n){proj.name=n;uiTransport();save();projectMenu()}};
  $('#pZip').onclick=()=>exportZip(false);$('#pZipM').onclick=()=>exportZip(true);$('#pMix').onclick=exportMix;
  $('#pNew').onclick=async()=>{await saveNow();const p=newProject();await DB.put('projects',p);closeModal();openProjectObj(p)};
  $('#pImp').onclick=()=>$('#zipIn').click();$('#zipIn').onchange=e=>{if(e.target.files[0])importZip(e.target.files[0])};
  $('#sLat').onchange=e=>{const v=e.target.value.trim();LS.set('latency',v===''?null:clamp(parseFloat(v)||0,-200,500))};
  $('#sClk').oninput=e=>LS.set('clickVol',parseFloat(e.target.value))}
async function deleteProject(id){const keys=await DB.keys('clips');for(const k of keys){const c=await DB.get('clips',k);if(c&&c.projectId===id)await DB.del('clips',k)}await DB.del('projects',id);
  if(id===proj.id){const rest=await DB.all('projects');if(rest.length)await openProject(rest.sort((a,b)=>b.modified-a.modified)[0].id);else{const p=newProject();await DB.put('projects',p);openProjectObj(p)}}}
async function openProject(id){const p=await DB.get('projects',id);if(!p)return false;await openProjectObj(p);return true}
async function openProjectObj(p){if(proj)stopAll();for(const[id,n]of A.chains){killChain(n);}A.chains.clear();
  proj=p;proj.master=proj.master||{vol:0,limit:true};for(const t of proj.tracks){t.fx=fillFx(t.fx||defaultFx());if(isMidi(t))t.inst=Object.assign(defaultInst(t.inst&&t.inst.type),t.inst||{})}proj.markers=proj.markers||[];proj.regions=proj.regions||[];undoS=[];redoS=[];sel={track:proj.tracks[0]&&proj.tracks[0].id,item:null};view.scrollX=proj.scrollX||0;view.scrollY=0;
  await loadClips();syncEngine();renderHeads();renderDrawer();uiTransport();LS.set('last',proj.id);dirty()}

/* ============================ top bar ============================ */
function uiTransport(){if(!proj)return;$('#bPlay').classList.toggle('on',P.playing&&!P.recording);$('#bPlay').textContent=P.playing?'■':'▶';$('#bRec').classList.toggle('on',P.recording);
  $('#bClick').classList.toggle('on',proj.click);$('#bCount').classList.toggle('on',proj.countIn);$('#bLoop').classList.toggle('on',proj.loop.on);
  if(document.activeElement!==$('#bpm'))$('#bpm').value=proj.bpm;$('#bpb').value=proj.bpb;$('#projName').textContent=proj.name;
  $('#recBadge').classList.toggle('on',P.recording);document.querySelectorAll('#snapSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===proj.snap));
  if(!P.playing)updateClock(proj.cursor)}
$('#bPlay').onclick=()=>{ensureCtx();play()};
$('#bRec').onclick=()=>{ensureCtx();record()};
$('#bHome').onclick=home;
$('#bClick').onclick=()=>{proj.click=!proj.click;uiTransport();save()};
$('#bCount').onclick=()=>{proj.countIn=!proj.countIn;uiTransport();save()};
$('#bLoop').onclick=()=>{if(proj.loop.end-proj.loop.start<0.05){proj.loop.start=snapT(proj.cursor);proj.loop.end=proj.loop.start+4*barDur()}proj.loop.on=!proj.loop.on;uiTransport();dirty();save();reschedule()};
$('#bpm').onchange=e=>{const v=clamp(parseFloat(e.target.value)||proj.bpm,30,300);pushUndo();const r=proj.bpm/v;proj.bpm=Math.round(v*100)/100;
  if(!proj.tracks.some(t=>t.items.length)){proj.loop.start*=r;proj.loop.end*=r}applyAll();uiTransport();dirty();save();e.target.blur()};
$('#bpb').onchange=e=>{proj.bpb=parseInt(e.target.value)||4;dirty();save()};
$('#bProj').onclick=projectMenu;$('#logo').onclick=projectMenu;
document.querySelectorAll('#snapSeg button').forEach(b=>b.onclick=()=>{proj.snap=b.dataset.v;uiTransport();dirty();save()});
document.querySelectorAll('#dSeg button').forEach(b=>b.onclick=()=>{drawerTab=b.dataset.v;LS.set('tab',drawerTab);$('#drawer').classList.remove('closed');$('#dToggle').textContent='HIDE';renderDrawer();setTimeout(resize,200)});
$('#dToggle').onclick=()=>{const d=$('#drawer');d.classList.toggle('closed');$('#dToggle').textContent=d.classList.contains('closed')?'SHOW':'HIDE';LS.set('drawer',d.classList.contains('closed'));setTimeout(resize,200)};
$('#tSplit').onclick=split;$('#tDup').onclick=duplicate;$('#tDel').onclick=delItem;$('#tUndo').onclick=undo;$('#tRedo').onclick=redo;
$('#tZi').onclick=()=>zoomBy(1.5);$('#tZo').onclick=()=>zoomBy(1/1.5);$('#tFit').onclick=zoomFit;
$('#tRegion').onclick=addRegion;$('#tImport').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
document.addEventListener('keydown',e=>{if(!proj||e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||$('#modal').classList.contains('on'))return;
  if(keysKeydown(e))return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();ensureCtx();play()}else if(k==='r'&&!e.metaKey){ensureCtx();record()}else if(k==='s'&&!e.metaKey){split()}
  else if(k==='delete'||k==='backspace'){delItem()}else if(k==='z'&&(e.metaKey||e.ctrlKey)){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='d'&&(e.metaKey||e.ctrlKey)){e.preventDefault();duplicate()}
  else if(k==='l'){$('#bLoop').click()}else if(k==='m'){addMarker()}else if(k==='c'){$('#bClick').click()}else if(k==='home'||k==='enter'){home()}});
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe($('#lanes'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
window.addEventListener('pagehide',()=>saveNow());

/* pixel logo */
(function logo(){const F={D:['11110','10001','10001','10001','10001','10001','11110'],E:['11111','10000','10000','11110','10000','10000','11111'],N:['10001','11001','11001','10101','10011','10011','10001'],
  S:['01111','10000','10000','01110','00001','00001','11110'],K:['10001','10010','10100','11000','10100','10010','10001'],T:['11111','00100','00100','00100','00100','00100','00100'],
  C:['01111','10000','10000','10000','10000','10000','01111'],H:['10001','10001','10001','11111','10001','10001','10001'],P:['11110','10001','10001','11110','10000','10000','10000'],A:['01110','10001','10001','11111','10001','10001','10001']};
  const c=$('#logo').getContext('2d');const px=2;let x=2;const put=(ch,col,y0,s)=>{const g=F[ch];for(let r=0;r<7;r++)for(let k=0;k<5;k++)if(g[r][k]==='1'){c.fillStyle='#000';c.fillRect(x+k*s+s/2,y0+r*s+s/2,s,s);c.fillStyle=col;c.fillRect(x+k*s,y0+r*s,s,s)}x+=6*s};
  for(const ch of'DEN')put(ch,'#f08a3c',4,3);x+=4;for(const ch of'SKETCHPAD')put(ch,'#f4ecdb',8,2)})();

/* ============================ boot ============================ */
(async function boot(){
  try{await DB.open()}catch(e){alert('Storage is not available: '+e.message);return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  audioSession('playback');ensureCtx();
  if(LS.get('drawer',false)){$('#drawer').classList.add('closed');$('#dToggle').textContent='SHOW'}
  const last=LS.get('last',null);let ok=false;if(last)ok=await openProject(last);
  if(!ok){const all=await DB.all('projects');if(all.length)ok=await openProject(all.sort((a,b)=>b.modified-a.modified)[0].id)}
  if(!ok){const p=newProject();await DB.put('projects',p);await openProjectObj(p)}
  resize();requestAnimationFrame(frame);
  // unlock audio on first touch (iOS)
  const unlock=()=>{ensureCtx();document.removeEventListener('pointerdown',unlock,true)};document.addEventListener('pointerdown',unlock,true);
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e))}
})();
