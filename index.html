<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketchpad">
<meta name="theme-color" content="#1f2b33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Den Sketchpad</title>
<style>
:root{
  --ink:#1c1a18; --bg:#1f2b33; --bg2:#26353f; --cream:#f4ecdb; --cream2:#e8dcc3; --cream3:#d9cbad;
  --muted:#7d7160; --orange:#f08a3c; --teal:#2a9d8f; --rose:#e06c75; --sun:#f2c14e; --rec:#d7263d;
  --sh:3px 3px 0 var(--ink); --sh2:2px 2px 0 var(--ink);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--ink);background:var(--cream);border:2px solid var(--ink);
  border-radius:7px;box-shadow:var(--sh2);padding:0 12px;height:38px;min-width:38px;cursor:pointer;letter-spacing:.04em}
button:active{transform:translate(2px,2px);box-shadow:none}
button.on{background:var(--sun)}
button:disabled{opacity:.4}
.lamp{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.lamp::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#8a7f6d}
.lamp.on::before{background:var(--lampc,#ffd84a);box-shadow:0 0 8px var(--lampc,#ffd84a)}
.lamp.on{background:var(--cream)}
/* header */
#top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ink);border-bottom:3px solid #000;flex-wrap:nowrap}
#logo{image-rendering:pixelated;flex:none;cursor:pointer}
.tgroup{display:flex;gap:6px;align-items:center}
#bPlay,#bRec,#bHome{width:50px;height:44px;font-size:18px;padding:0}
#bRec{color:var(--rec)}
#bRec.on{background:var(--rec);color:var(--cream)}
#bPlay.on{background:var(--teal);color:var(--cream)}
#clock{font-family:var(--mono);background:#0e1316;color:#9ff0c9;border:2px solid #000;border-radius:7px;padding:3px 10px;min-width:150px;
  box-shadow:inset 0 0 0 1px #2f3d38;line-height:1.1}
#clock b{font-size:20px;display:block;letter-spacing:.04em}
#clock span{font-size:12px;color:#6fae94}
#bpmBox{display:flex;align-items:center;gap:4px;background:var(--cream);border:2px solid var(--ink);border-radius:7px;padding:2px 4px;box-shadow:var(--sh2);height:38px}
#bpmBox input{width:52px;font:700 17px var(--mono);border:0;background:transparent;text-align:center;color:var(--ink)}
#bpmBox small{font-size:10px;font-weight:800;color:var(--muted)}
#bpmBox select{border:0;background:transparent;font:700 13px var(--mono);color:var(--ink)}
.spacer{flex:1}
#projName{color:var(--cream);font-weight:700;font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
#recBadge{display:none;background:var(--rec);color:#fff;font:800 12px var(--mono);padding:4px 8px;border-radius:5px}
#recBadge.on{display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
/* toolbar */
#tools{display:flex;gap:7px;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:2px solid #000;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools button{height:34px;font-size:12px;flex:none}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:7px;overflow:hidden;box-shadow:var(--sh2);flex:none;background:var(--cream)}
.seg button{border:0;border-radius:0;box-shadow:none;height:30px;min-width:0;padding:0 9px;border-right:2px solid var(--ink);font-size:11px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--cream)}
.tlabel{color:var(--cream3);font:800 10px var(--sans);letter-spacing:.12em;flex:none}
/* main */
#main{flex:1;display:flex;min-height:0;position:relative}
#heads{width:176px;flex:none;background:var(--bg2);border-right:3px solid #000;overflow:hidden;position:relative}
#headsInner{position:absolute;left:0;right:0;top:114px}
#headTop{position:absolute;left:0;right:0;top:0;z-index:2;background:var(--bg2)}
.th.mh{height:64px;background:#2f2a1c;border-bottom:3px solid #000}.th.mh.sel{background:#4a4226}.th.mh .nm{color:#f2c14e;letter-spacing:.12em}
.th.mh .row button{height:24px;font-size:10px}.th.mh .bd{padding:4px 7px;gap:3px}.th.mh .nm{font-size:11px;line-height:14px}
#rulerPad{height:50px;background:var(--ink);border-bottom:2px solid #000;display:flex;align-items:center;justify-content:center;gap:6px}
#rulerPad button{height:24px;font-size:10px;padding:0 8px;box-shadow:none}
.th{height:92px;border-bottom:2px solid #11181d;display:flex;position:relative;background:var(--bg2)}
.th.sel{background:#32444f}
.th .col{width:8px;flex:none}
.th .bd{flex:1;padding:6px 7px;display:flex;flex-direction:column;gap:5px;min-width:0}
.th .nm{color:var(--cream);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.th .row{display:flex;gap:4px;align-items:center}
.th .row button{height:28px;min-width:30px;padding:0 6px;font-size:11px;box-shadow:none;border-width:2px}
.th .row button.m.on{background:var(--rose)}
.th .row button.s.on{background:var(--sun)}
.th .row button.r{color:var(--rec)}
.th .row button.r.on{background:var(--rec);color:#fff}
.th select{height:28px;border:2px solid var(--ink);border-radius:6px;background:var(--cream);font:700 11px var(--sans);padding:0 2px;color:var(--ink)}
.th canvas.mt{height:6px;width:100%;background:#0e1316;border-radius:3px}
#addTrack{margin:10px;width:calc(100% - 20px)}
#lanes{flex:1;position:relative;min-width:0;background:#182229}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* drawer */
#drawer{height:300px;flex:none;background:var(--bg2);border-top:3px solid #000;display:flex;flex-direction:column;transition:height .15s}
#drawer.closed{height:48px}
#dtabs{display:flex;gap:8px;align-items:center;padding:7px 12px}
#dbody{flex:1;overflow:auto;padding:4px 12px 14px;-webkit-overflow-scrolling:touch}
#drawer.closed #dbody{display:none}
.cards{display:flex;gap:14px;align-items:stretch;min-height:100%}
.card{background:var(--cream);border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:24px 12px 10px;position:relative;flex:none}
.card .tab{position:absolute;top:-2px;left:12px;transform:translateY(-50%);background:var(--ink);color:var(--cream);font:800 11px var(--sans);letter-spacing:.14em;padding:4px 9px;border-radius:5px}
.card .tab.c{background:var(--tc,var(--ink))}
.card .sw{position:absolute;top:6px;right:8px;height:26px;font-size:10px;padding:0 8px;box-shadow:none}
.knobs{display:flex;gap:8px;align-items:flex-start}
.knob{width:66px;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:ns-resize}
.knob svg{width:58px;height:58px}
.knob .klab{font:800 10px var(--sans);letter-spacing:.1em;margin-top:2px}
.knob .kval{font:700 11px var(--mono);color:var(--muted);height:14px}
.card.off .knobs{opacity:.45}
/* mixer */
.strip .sb{display:flex;gap:12px;align-items:flex-start}.strip .sc{display:flex;flex-direction:column;align-items:center;gap:5px}
.strip{width:124px;padding:20px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.strip .knob{width:52px}.strip .knob svg{width:42px;height:42px}.strip .knob .kval{height:12px}
.strip.sel{outline:3px solid var(--sun);outline-offset:2px}
.fader{width:44px;height:100px;position:relative;touch-action:none;cursor:ns-resize}
.fader .slot{position:absolute;left:19px;top:6px;bottom:6px;width:6px;background:var(--ink);border-radius:3px}
.fader .cap{position:absolute;left:4px;width:36px;height:20px;background:var(--ink);border-radius:4px;border:2px solid var(--ink);box-shadow:inset 0 -6px 0 #000}
.fader .cap::after{content:"";position:absolute;left:4px;right:4px;top:7px;height:2px;background:var(--fc,var(--orange))}
.fader canvas{position:absolute;right:-6px;top:6px;width:6px;height:88px;background:#0e1316;border-radius:2px}
.strip .db{font:700 11px var(--mono)}
.strip .row{display:flex;gap:4px}
.strip .row button{height:26px;min-width:28px;padding:0 5px;font-size:10px;box-shadow:none}
.strip .row button.m.on{background:var(--rose)}.strip .row button.s.on{background:var(--sun)}
.strip .nm{font:800 11px var(--sans);max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itembox{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.btncol{display:grid;grid-template-columns:repeat(3,auto);gap:8px}
.hint{color:var(--cream3);font-size:13px;padding:14px 4px;line-height:1.5}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,14,17,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal.on{display:flex}
#mbox{background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink);width:min(640px,100%);max-height:90vh;overflow:auto;padding:30px 20px 20px;position:relative}
#mbox h2{margin:0 0 12px;font-size:18px;letter-spacing:.06em}
#mbox h3{margin:18px 0 8px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
#mbox .x{position:absolute;right:12px;top:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:#fff8ea;border:2px solid var(--ink);border-radius:8px;padding:8px 10px}
.pitem.cur{background:var(--sun)}
.pitem div{flex:1;min-width:0}
.pitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{color:var(--muted);font-family:var(--mono)}
.grid2{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;line-height:1.5;color:#4b4236}
#toast{position:fixed;left:50%;bottom:310px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;border:2px solid var(--cream3)}
#toast.on{opacity:1}
input.txt{font:600 15px var(--sans);border:2px solid var(--ink);border-radius:7px;padding:8px 10px;width:100%;background:#fff8ea;color:var(--ink)}
@media (max-width:1000px){
  #projName{display:none}
  #heads{width:150px}
  #clock{min-width:118px}
  #clock b{font-size:17px}
}
@media (max-width:800px){
  #logo{display:none}
  .knob{width:58px}.knob svg{width:50px;height:50px}
}
</style>
</head>
<body>
<div id="top">
  <canvas id="logo" width="172" height="30" title="Projects"></canvas>
  <div class="tgroup">
    <button id="bHome" title="Back to start">⏮</button>
    <button id="bPlay" title="Play / stop (space)">▶</button>
    <button id="bRec" title="Record (R)">●</button>
  </div>
  <div id="clock"><b id="ck1">1.1.00</b><span id="ck2">0:00.0</span></div>
  <div id="bpmBox"><small>BPM</small><input id="bpm" type="number" inputmode="decimal" min="30" max="300" step="1"><select id="bpb"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select><small>/4</small></div>
  <button id="bClick" class="lamp">CLICK</button>
  <button id="bCount" class="lamp">COUNT-IN</button>
  <button id="bLoop" class="lamp">LOOP</button>
  <span id="recBadge">REC 0:00</span>
  <div class="spacer"></div>
  <span id="projName"></span>
  <button id="bProj">PROJECT</button>
</div>
<div id="tools">
  <span class="tlabel">SNAP</span>
  <div class="seg" id="snapSeg"><button data-v="off">OFF</button><button data-v="16">1/16</button><button data-v="beat">BEAT</button><button data-v="bar">BAR</button></div>
  <button id="tSplit">SPLIT</button>
  <button id="tDup">DUPLICATE</button>
  <button id="tDel">DELETE</button>
  <button id="tUndo">UNDO</button>
  <button id="tRedo">REDO</button>
  <span class="tlabel">ZOOM</span>
  <button id="tZo">−</button><button id="tZi">+</button><button id="tFit">FIT</button>
  <button id="tImport">IMPORT AUDIO</button>
  <input id="fileIn" type="file" accept="audio/*,.wav,.aif,.aiff,.mp3,.m4a,.caf,.flac" multiple hidden>
</div>
<div id="main">
  <div id="heads"><div id="headsInner"></div><div id="headTop"></div></div>
  <div id="lanes"><canvas id="cv"></canvas></div>
</div>
<div id="drawer">
  <div id="dtabs">
    <div class="seg" id="dSeg"><button data-v="mix">MIX</button><button data-v="fx">FX</button><button data-v="item">ITEM</button><button data-v="sect">SECTIONS</button></div>
    <span class="tlabel" id="dTitle"></span>
    <div class="spacer"></div>
    <button id="dToggle">HIDE</button>
  </div>
  <div id="dbody"></div>
</div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
const VERSION='0.3';
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dbLin=d=>d<=-60?0:Math.pow(10,d/20);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const COLORS=['#f08a3c','#2a9d8f','#e06c75','#f2c14e','#7b8cde','#8bbf6a','#c97bd6','#5fb7d4','#d9935c','#59b39a','#e891a3','#b9a64a'];
const ECHO_STEPS=[['1/16',.25],['1/8',.5],['1/8.',.75],['1/4',1],['1/4.',1.5],['1/2',2]];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let toastT=0;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2200)}
function fmtTime(t){const s=Math.max(0,t);const m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')}
function dateStr(){const d=new Date();return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toTimeString().slice(0,5)}
function safeName(s){return String(s).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'Sketch'}

/* ============================ storage ============================ */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('den-sketchpad',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('clips',{keyPath:'id'})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const r=fn(t.objectStore(st));let out;
    if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(st,v){return this.tx(st,'readwrite',s=>s.put(v))},
  get(st,k){return this.tx(st,'readonly',s=>s.get(k))},
  all(st){return this.tx(st,'readonly',s=>s.getAll())},
  del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))},
  keys(st){return this.tx(st,'readonly',s=>s.getAllKeys())}
};
const LS={get(k,d){try{const v=localStorage.getItem('denSketch.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('denSketch.'+k,JSON.stringify(v))}catch(e){}}};

/* ============================ model ============================ */
function defaultFx(){return{eq:{on:false,hp:20,low:0,mid:0,midF:900,high:0},comp:{on:false,amount:35,make:0},
  echo:{on:false,time:3,fb:35,tone:45,mix:25},haze:{on:false,size:55,tone:45,motion:40,mix:35}}}
function newTrack(i){return{id:uid(),name:'Track '+(i+1),color:COLORS[i%COLORS.length],vol:0,pan:0,mute:false,solo:false,arm:false,input:'1',fx:defaultFx(),items:[]}}
function newProject(name){const p={id:uid(),name:name||('Sketch '+dateStr()),v:VERSION,bpm:90,bpb:4,created:Date.now(),modified:Date.now(),
  loop:{on:false,start:0,end:0},cursor:0,click:false,countIn:true,snap:'beat',zoom:60,scrollX:0,master:{vol:0,limit:true,fx:defaultFx()},markers:[],regions:[],tracks:[],clips:{}};
  for(let i=0;i<4;i++)p.tracks.push(newTrack(i));p.tracks[0].arm=true;p.loop.end=4*p.bpb*60/p.bpm;return p}
let proj=null;
const AUD=new Map(); // clipId -> {buf, peaks}
let sel={track:null,item:null};
function trackById(id){return proj.tracks.find(t=>t.id===id)}
// the master bus as a track-like object (its FX settings live in proj.master.fx)
function MT(ms){ms=ms||proj.master;if(!ms.fx)ms.fx=defaultFx();return{id:'master',name:'MASTER',color:'#f2c14e',fx:ms.fx,vol:0,pan:0,mute:false,solo:false,isMaster:true,items:[]}}
function selTrack(){return sel.track==='master'?MT():(trackById(sel.track)||proj.tracks[0])}
function findItem(id){for(const t of proj.tracks){const it=t.items.find(i=>i.id===id);if(it)return{t,it}}return null}
function beatDur(){return 60/proj.bpm}
function barDur(){return beatDur()*proj.bpb}
function gridLen(){const s=proj.snap;return s==='16'?beatDur()/4:s==='beat'?beatDur():s==='bar'?barDur():0}
function snapT(t){const g=gridLen();return g?Math.round(t/g)*g:t}
function projEnd(){let e=0;for(const t of proj.tracks)for(const it of t.items)e=Math.max(e,it.pos+it.len);return e}

/* undo */
let undoS=[],redoS=[];
function snap(){return JSON.stringify({bpm:proj.bpm,bpb:proj.bpb,loop:proj.loop,tracks:proj.tracks,master:proj.master,markers:proj.markers,regions:proj.regions})}
function pushUndo(){undoS.push(snap());if(undoS.length>80)undoS.shift();redoS=[]}
function restore(s){Object.assign(proj,JSON.parse(s));if(sel.item&&!findItem(sel.item))sel.item=null;if(sel.track!=='master'&&!trackById(sel.track))sel.track=proj.tracks[0]&&proj.tracks[0].id;
  syncEngine();renderHeads();renderDrawer();uiTransport();dirty();save();reschedule()}
function undo(){if(!undoS.length)return toast('Nothing to undo');redoS.push(snap());restore(undoS.pop())}
function redo(){if(!redoS.length)return toast('Nothing to redo');undoS.push(snap());restore(redoS.pop())}

let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,500)}
async function saveNow(){if(!proj)return;proj.modified=Date.now();try{await DB.put('projects',JSON.parse(JSON.stringify(proj)));LS.set('last',proj.id)}catch(e){console.error(e);toast('Save failed: '+e.message)}}

/* ============================ audio engine ============================ */
const A={ctx:null,master:null,chains:new Map(),irCache:new Map(),input:null,recNode:null};
function ctxNew(){const C=window.AudioContext||window.webkitAudioContext;return new C({latencyHint:'interactive'})}
function ensureCtx(){if(!A.ctx){A.ctx=ctxNew();A.master=buildMaster(A.ctx,A.ctx.destination)}
  if(A.ctx.state!=='running')A.ctx.resume();return A.ctx}
function bq(ctx,type,f,q){const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;return b}
function buildMaster(ctx,dest){const m={};const ms=proj?proj.master:{vol:0,limit:true,fx:defaultFx()};m.lim=ctx.createDynamicsCompressor();m.out=ctx.createGain();
  m.an=ctx.createAnalyser?ctx.createAnalyser():null;m.chain=buildChain(ctx,MT(ms),m.lim);m.in=m.chain.in;m.lim.connect(m.out);m.out.connect(dest);
  if(m.an&&!(ctx instanceof (window.OfflineAudioContext||Object))){m.an.fftSize=512;m.out.connect(m.an)}
  m.lim.knee.value=0;m.lim.attack.value=0.002;m.lim.release.value=0.12;applyMaster(m,ctx,ms);return m}
function applyMaster(m,ctx,ms){const n=ctx.currentTime;m.out.gain.setTargetAtTime(dbLin(ms.vol),n,0.02);
  m.lim.threshold.value=ms.limit?-2:0;m.lim.ratio.value=ms.limit?20:1}
function setP(param,v,ctx){param.setTargetAtTime(v,ctx.currentTime,0.03)}

      const chs=[];for(let c=0;c<Math.min(2,buf.numberOfChannels);c++)chs.push(buf.getChannelData(c).slice());
      const id=await storeClip(f.name.replace(/\.[^.]+$/,''),chs,buf.sampleRate);
      const it={id:'i'+uid(),clip:id,name:f.name.replace(/\.[^.]+$/,''),pos,len:buf.duration,offs:0,fadeIn:0,fadeOut:0,gain:0};t.items.push(it);sel.item=it.id;pos+=buf.duration}
    catch(e){console.error(e);toast('Could not read '+f.name+' ('+e.message+')',4000)}}
  dirty();save();renderDrawer();toast('Imported '+files.length+' file(s)')}
function decode(ctx,ab){const w=parseWav(ab);if(w){const b=ctx.createBuffer(w.ch.length,w.ch[0].length,w.sr);w.ch.forEach((d,i)=>b.getChannelData(i).set(d));return Promise.resolve(b)}
  return new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab.slice(0),res,rej);if(p&&p.then)p.then(res,rej)})}

function wavEncode(chs,sr,bits){bits=bits||24;const n=chs[0].length,nc=chs.length,bps=bits/8,ba=nc*bps,size=44+n*ba;const out=new Uint8Array(size),v=new DataView(out.buffer);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)out[o+i]=s.charCodeAt(i)};ws(0,'RIFF');v.setUint32(4,size-8,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ba,true);v.setUint16(32,ba,true);v.setUint16(34,bits,true);ws(36,'data');v.setUint32(40,n*ba,true);let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<nc;c++){let s=chs[c][i];s=s>1?1:s<-1?-1:s;if(bits===24){let x=Math.round(s*8388607);out[o]=x&255;out[o+1]=(x>>8)&255;out[o+2]=(x>>16)&255;o+=3}else{v.setInt16(o,Math.round(s*32767),true);o+=2}}
  return out}
function parseWav(ab){const v=new DataView(ab);if(ab.byteLength<44)return null;const s4=o=>String.fromCharCode(v.getUint8(o),v.getUint8(o+1),v.getUint8(o+2),v.getUint8(o+3));
  if(s4(0)!=='RIFF'||s4(8)!=='WAVE')return null;let o=12,fmt=null;
  while(o+8<=ab.byteLength){const id=s4(o),sz=v.getUint32(o+4,true);
    if(id==='fmt '){fmt={tag:v.getUint16(o+8,true),nc:v.getUint16(o+10,true),sr:v.getUint32(o+12,true),bits:v.getUint16(o+22,true)};if(fmt.tag===0xFFFE&&sz>=40)fmt.tag=v.getUint16(o+32,true)}
    else if(id==='data'&&fmt){const bps=fmt.bits/8,nc=fmt.nc,n=Math.floor(Math.min(sz,ab.byteLength-o-8)/(bps*nc));if(!(fmt.tag===1||fmt.tag===3)||![16,24,32].includes(fmt.bits))return null;
      const ch=[];for(let c=0;c<Math.min(nc,2);c++)ch.push(new Float32Array(n));let p=o+8;
      for(let i=0;i<n;i++)for(let c=0;c<nc;c++){let x;if(fmt.tag===3&&fmt.bits===32)x=v.getFloat32(p,true);else if(fmt.bits===16)x=v.getInt16(p,true)/32768;
        else if(fmt.bits===24){x=(v.getUint8(p)|(v.getUint8(p+1)<<8)|(v.getInt8(p+2)<<16))/8388608}else x=v.getInt32(p,true)/2147483648;if(c<2)ch[c][i]=x;p+=bps}
      return{sr:fmt.sr,ch}}
    o+=8+sz+(sz&1)}return null}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder();const parts=[],cent=[];let off=0;const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){const nm=enc.encode(f.name),data=f.data,crc=crc32(data);const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);
    h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cent.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+data.length}
  const csz=cent.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cent,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function readZip(ab){const v=new DataView(ab),u=new Uint8Array(ab);let e=-1;for(let i=ab.byteLength-22;i>=Math.max(0,ab.byteLength-70000);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('not a zip file');const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out={};const dec=new TextDecoder();
  for(let k=0;k<n;k++){const method=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let data=u.slice(ds,ds+cs);
    if(method===8){if(!window.DecompressionStream)throw new Error('compressed zip not supported on this browser');data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
    else if(method!==0)throw new Error('zip method '+method+' not supported');
    out[name]=data;p+=46+nl+xl+cl}return out}
// iOS only allows the share sheet straight from a tap, so the file is built first, then offered on a button
function deliverFiles(files){if(files.length===1)return deliver(files[0],files[0].name);const mb=(files.reduce((a,f)=>a+f.size,0)/1048576).toFixed(1);
  openModal(`<h2>READY</h2><p class="note"><b>${files.length} WAVs</b> (${mb} MB): ${files.map(f=>esc(f.name)).join(', ')}</p><div class="grid2"><button id="dShare">SHARE / SAVE TO FILES</button><button id="dDl">DOWNLOAD ALL</button></div>
  <p class="note">In the share sheet pick <b>Save to Files</b> and choose a Dropbox folder. All of them go in one go.</p>`);
  const dl=()=>{files.forEach((f,k)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000)},k*700));toast('Downloading '+files.length+' files')};
  $('#dShare').onclick=async()=>{if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:proj.name});closeModal();return}catch(e){if(e.name==='AbortError')return}}dl()};$('#dDl').onclick=dl;toast('Ready');return true}
function deliver(blob,name){const file=new File([blob],name,{type:blob.type});const mb=(blob.size/1048576).toFixed(1);
  openModal(`<h2>READY</h2><p class="note"><b>${esc(name)}</b> (${mb} MB)</p><div class="grid2"><button id="dShare">SHARE / SAVE TO FILES</button><button id="dDl">DOWNLOAD</button></div>
  <p class="note">In the share sheet pick <b>Save to Files</b> and choose a Dropbox folder (for example Dropbox/REAPER/_SKETCHES). DOWNLOAD puts it in Files &gt; Downloads instead.</p>`);
  $('#dShare').onclick=async()=>{if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});closeModal();return}catch(e){if(e.name==='AbortError')return}}dl()};
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);toast('Downloaded '+name)};
  $('#dDl').onclick=dl;toast('Ready');return true}

function projectJson(){const used=new Set();proj.tracks.forEach(t=>t.items.forEach(i=>used.add(i.clip)));
  const clips={};for(const id of used)if(proj.clips[id])clips[id]=Object.assign({},proj.clips[id],{file:'audio/'+id+'.wav'});
  return{format:'den-sketchpad',version:VERSION,name:proj.name,bpm:proj.bpm,bpb:proj.bpb,exported:new Date().toISOString(),loop:proj.loop,cursor:proj.cursor,master:proj.master,markers:proj.markers||[],regions:proj.regions||[],
    tracks:proj.tracks.map(t=>({name:t.name,color:t.color,vol:t.vol,pan:t.pan,mute:t.mute,solo:t.solo,input:t.input,fx:t.fx,
      items:t.items.slice().sort((a,b)=>a.pos-b.pos).map(i=>({name:i.name,clip:i.clip,file:'audio/'+i.clip+'.wav',pos:i.pos,len:i.len,offs:i.offs||0,fadeIn:i.fadeIn||0,fadeOut:i.fadeOut||0,gain:i.gain||0}))})),clips}}
async function exportZip(withMix){toast('Building zip…',8000);await saveNow();const pj=projectJson();const files=[];
  files.push({name:'project.json',data:new TextEncoder().encode(JSON.stringify(pj,null,1))});
  for(const id of Object.keys(pj.clips)){const a=AUD.get(id);if(!a)continue;const chs=[];for(let c=0;c<a.buf.numberOfChannels;c++)chs.push(a.buf.getChannelData(c));files.push({name:'audio/'+id+'.wav',data:wavEncode(chs,a.buf.sampleRate,24)})}
  if(withMix){const mb=await renderMix();if(mb){const chs=[mb.getChannelData(0),mb.getChannelData(1)];files.push({name:'mixdown.wav',data:wavEncode(chs,mb.sampleRate,24)})}}
  files.push({name:'README.txt',data:new TextEncoder().encode('Den Sketchpad project "'+proj.name+'"\nOpen in REAPER with the action: Den Sketchpad Import (pick this zip or project.json).\n')});
  const nm=safeName(proj.name)+'.sketch.zip';await deliver(makeZip(files),nm)}
// renders the master bus (all tracks + master FX + limiter) between from and to, plus the FX tail
async function renderMix(from,to,label){from=from||0;const end=to!=null?to:projEnd();if(end-from<=0.01){toast('Nothing to mix');return null}
  const sr=A.ctx?A.ctx.sampleRate:48000;const tail=proj.tracks.concat([MT()]).some(t=>t.fx.haze.on||t.fx.echo.on)?6:0.5;const len=Math.ceil((end-from+tail)*sr);
  const oc=new OfflineAudioContext(2,len,sr);const m=buildMaster(oc,oc.destination);applyMaster(m,oc,proj.master);
  for(const t of proj.tracks){const n=buildChain(oc,t,m.in);for(const it of t.items)scheduleItem(oc,it,t,n.in,from,end,0,null)}
  toast('Rendering '+(label||'mix')+'…',30000);const b=await oc.startRendering();return b}
async function exportMix(){return mixChooser()}
function mixChooser(){const rs=proj.regions;if(!rs.length)return renderMixes([{name:'mix',start:0,end:null}]);
  openModal(`<h2>EXPORT MIX</h2><p class="note">The master track: every track through the master FX and limiter. Pick what to bounce. Each one becomes its own WAV (24-bit) with the reverb/echo tail.</p>
   <div class="plist" id="mxList"></div><div class="grid2" style="margin-top:12px"><button id="mxAll">ALL</button><button id="mxNone">NONE</button><div class="spacer"></div><button id="mxGo" style="background:#f2c14e">BOUNCE</button></div>`);
  const L=$('#mxList');const opts=[{name:'Whole song',start:0,end:null,whole:true,exp:!rs.some(g=>g.exp)}].concat(rs);const sel=new Map(opts.map(o=>[o,!!o.exp]));
  const draw=()=>{L.innerHTML='';for(const o of opts){const d=el('div','pitem'+(sel.get(o)?' cur':''),`<div><b>${esc(o.name)}</b><small>${o.whole?'0:00.0 – '+fmtTime(projEnd()):fmtTime(o.start)+' – '+fmtTime(o.end)}</small></div>`);
    d.onclick=()=>{sel.set(o,!sel.get(o));if(!o.whole)o.exp=sel.get(o);draw()};L.appendChild(d)}};draw();
  $('#mxAll').onclick=()=>{opts.forEach(o=>{sel.set(o,true);if(!o.whole)o.exp=true});draw()};$('#mxNone').onclick=()=>{opts.forEach(o=>{sel.set(o,false);if(!o.whole)o.exp=false});draw()};
  $('#mxGo').onclick=()=>{const list=opts.filter(o=>sel.get(o));if(!list.length)return toast('Pick at least one');save();renderMixes(list)}}
async function renderMixes(list){const files=[];let i=0;
  for(const o of list){i++;const b=await renderMix(o.start,o.end,(list.length>1?i+'/'+list.length+' ':'')+o.name);if(!b)continue;
    const w=wavEncode([b.getChannelData(0),b.getChannelData(1)],b.sampleRate,24);const nm=safeName(proj.name)+(o.whole||o.name==='mix'?'_mix':'_'+safeName(o.name))+'.wav';files.push(new File([w],nm,{type:'audio/wav'}))}
  if(files.length)deliverFiles(files)}
async function importZip(file){try{const z=await readZip(await file.arrayBuffer());const pjB=z['project.json']||Object.entries(z).find(([k])=>k.endsWith('project.json'))?.[1];
    if(!pjB)throw new Error('no project.json inside');const pj=JSON.parse(new TextDecoder().decode(pjB));const prefix=Object.keys(z).find(k=>k.endsWith('project.json')).replace('project.json','');
    stopAll();const p=newProject(/from REAPER/.test(pj.name)?pj.name:pj.name+' (imported)');p.tracks=[];p.bpm=pj.bpm||90;p.bpb=pj.bpb||4;if(pj.loop)p.loop=pj.loop;p.markers=(pj.markers||[]).map(m=>({id:'m'+uid(),name:m.name||'',pos:+m.pos||0,color:m.color||'#f4ecdb'}));p.regions=(pj.regions||[]).map((g,k)=>({id:'r'+uid(),name:g.name||'',start:+g.start||0,end:+g.end||0,color:g.color||SECT_COLORS[k%SECT_COLORS.length],exp:!!g.exp}));if(pj.master)p.master=Object.assign({vol:0,limit:true},pj.master,{fx:Object.assign(defaultFx(),pj.master.fx||{})});
    proj=p;AUD.clear();const ctx=ensureCtx();const map={};
    for(const[id,c]of Object.entries(pj.clips||{})){const d=z[prefix+c.file];if(!d)continue;const buf=await decode(ctx,d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength));
      const chs=[];for(let k=0;k<buf.numberOfChannels;k++)chs.push(buf.getChannelData(k).slice());map[id]=await storeClip(c.name||id,chs,buf.sampleRate)}
    pj.tracks.forEach((t,i)=>{const nt=newTrack(i);Object.assign(nt,{name:t.name,color:t.color||nt.color,vol:t.vol||0,pan:t.pan||0,mute:!!t.mute,solo:!!t.solo,input:t.input||'1'});
      if(t.fx)nt.fx=Object.assign(defaultFx(),t.fx);nt.items=(t.items||[]).filter(it=>map[it.clip]).map(it=>({id:'i'+uid(),clip:map[it.clip],name:it.name,pos:it.pos,len:it.len,offs:it.offs||0,fadeIn:it.fadeIn||0,fadeOut:it.fadeOut||0,gain:it.gain||0}));p.tracks.push(nt)});
    if(!p.tracks.length)p.tracks.push(newTrack(0));await saveNow();openProjectObj(p);closeModal();toast('Imported '+p.name)}
  catch(e){console.error(e);toast('Import failed: '+e.message,5000)}}

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];const[x0,y0]=p(a0),[x1,y1]=p(a1);return`M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
function Knob(o){// {label,min,max,value,def,fmt,color,onChange,bipolar,steps}
  const k=el('div','knob');k.innerHTML=`<svg viewBox="0 0 60 60"><path d="${arc(30,30,25,-135,135)}" fill="none" stroke="#cbbfa6" stroke-width="5" stroke-linecap="round"/><path class="a" fill="none" stroke="${o.color||'#f08a3c'}" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="30" r="19" fill="#1c1a18"/><circle cx="30" cy="30" r="19" fill="none" stroke="#000" stroke-width="2"/><line class="p" x1="30" y1="30" x2="30" y2="14" stroke="#f4ecdb" stroke-width="3" stroke-linecap="round"/></svg><div class="klab">${o.label}</div><div class="kval"></div>`;
  const pa=k.querySelector('.a'),pl=k.querySelector('.p'),kv=k.querySelector('.kval');let v=o.value;
  const norm=x=>(x-o.min)/(o.max-o.min);
  function show(){const a=-135+270*norm(v);const a0=o.bipolar?0:-135;const lo=Math.min(a0,a),hi=Math.max(a0,a);pa.setAttribute('d',hi-lo<0.5?'':arc(30,30,25,lo,hi));pl.setAttribute('transform',`rotate(${a} 30 30)`);kv.textContent=o.fmt?o.fmt(v):Math.round(v)}
  let st=null,lastTap=0;
  k.addEventListener('pointerdown',e=>{k.setPointerCapture(e.pointerId);st={y:e.clientY,x:e.clientX,v};const n=Date.now();if(n-lastTap<300&&o.def!=null){v=o.def;show();o.onChange(v,true);st=null}lastTap=n;e.preventDefault()});
  k.addEventListener('pointermove',e=>{if(!st)return;const d=(st.y-e.clientY)+(e.clientX-st.x)*0.5;let nv=st.v+d/(e.shiftKey?600:160)*(o.max-o.min);nv=clamp(nv,o.min,o.max);if(o.steps)nv=Math.round(nv);if(nv!==v){v=nv;show();o.onChange(v,false)}});
  const up=()=>{if(st){st=null;o.onChange(v,true)}};k.addEventListener('pointerup',up);k.addEventListener('pointercancel',up);
  k.set=x=>{v=x;show()};show();return k}
function Fader(o){const f=el('div','fader');f.style.setProperty('--fc',o.color);f.innerHTML='<div class="slot"></div><div class="cap"></div><canvas width="6" height="88"></canvas>';const cap=f.querySelector('.cap');
  const H=100,top=6,bot=H-6-20;// value -60..+6 dB on a curve
  const toPos=d=>{const n=d<=-60?0:Math.pow((d+60)/66,2.2);return bot-(bot-top)*n};const toDb=p=>{const n=clamp((bot-p)/(bot-top),0,1);return n<=0?-60:Math.pow(n,1/2.2)*66-60};
  let v=o.value;const show=()=>{cap.style.top=toPos(v)+'px'};let st=null,lastTap=0;
  f.addEventListener('pointerdown',e=>{f.setPointerCapture(e.pointerId);st={y:e.clientY,p:toPos(v)};const n=Date.now();if(n-lastTap<300){v=0;show();o.onChange(v,true);st=null}lastTap=n;e.preventDefault()});
  f.addEventListener('pointermove',e=>{if(!st)return;v=Math.round(toDb(st.p+(e.clientY-st.y))*10)/10;if(v<-59.9)v=-60;show();o.onChange(v,false)});
  const up=()=>{if(st){st=null;o.onChange(v,true)}};f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up);f.meter=f.querySelector('canvas');show();return f}

const mbuf=new Float32Array(256);let mLast=0;
function peakOf(an){if(!an)return 0;an.getFloatTimeDomainData(mbuf);let m=0;for(let i=0;i<mbuf.length;i++){const v=Math.abs(mbuf[i]);if(v>m)m=v}return m}
function paintMeter(cv,v,horiz){if(!cv)return;const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.fillStyle='#0e1316';c.fillRect(0,0,W,H);const db=v>0?20*Math.log10(v):-90;const n=clamp((db+54)/54,0,1);
  c.fillStyle=db>-1?'#d7263d':db>-9?'#f2c14e':'#4fd1a5';if(horiz)c.fillRect(0,0,W*n,H);else c.fillRect(0,H*(1-n),W,H*n)}
function meters(){const now=performance.now();if(now-mLast<50)return;mLast=now;if(!A.ctx)return;
  for(const t of proj.tracks){const n=A.chains.get(t.id);let v=P.playing?peakOf(n&&n.an):0;if(t.arm&&A.input&&!P.playing)v=inPeak;if(t.arm&&P.recording)v=Math.max(v,inPeak);
    t._pk=Math.max(v,(t._pk||0)*0.85);paintMeter(t._mt,t._pk,true);if(t._fm)paintMeter(t._fm,t._pk,false)}
  {const v=P.playing?peakOf(A.master.an):0;mPk=Math.max(v,mPk*0.85);if(masterMeter)paintMeter(masterMeter,mPk,false);paintMeter(masterHeadMeter,mPk,true)}
  inPeak*=0.9}

document.querySelectorAll('#dSeg button').forEach(b=>b.onclick=()=>{drawerTab=b.dataset.v;LS.set('tab',drawerTab);$('#drawer').classList.remove('closed');$('#dToggle').textContent='HIDE';renderDrawer();setTimeout(resize,200)});
$('#dToggle').onclick=()=>{const d=$('#drawer');d.classList.toggle('closed');$('#dToggle').textContent=d.classList.contains('closed')?'SHOW':'HIDE';LS.set('drawer',d.classList.contains('closed'));setTimeout(resize,200)};
$('#tSplit').onclick=split;$('#tDup').onclick=duplicate;$('#tDel').onclick=delItem;$('#tUndo').onclick=undo;$('#tRedo').onclick=redo;
$('#tZi').onclick=()=>zoomBy(1.5);$('#tZo').onclick=()=>zoomBy(1/1.5);$('#tFit').onclick=zoomFit;
$('#tImport').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
document.addEventListener('keydown',e=>{if(!proj||e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||$('#modal').classList.contains('on'))return;
  const k=e.key.toLowerCase();if(k===' '){e.preventDefault();ensureCtx();play()}else if(k==='r'&&!e.metaKey){ensureCtx();record()}else if(k==='s'&&!e.metaKey){split()}
  else if(k==='delete'||k==='backspace'){delItem()}else if(k==='z'&&(e.metaKey||e.ctrlKey)){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='d'&&(e.metaKey||e.ctrlKey)){e.preventDefault();duplicate()}
  else if(k==='l'){$('#bLoop').click()}else if(k==='m'){addMarker()}else if(k==='c'){$('#bClick').click()}else if(k==='home'||k==='enter'){home()}});
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe($('#lanes'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
window.addEventListener('pagehide',()=>saveNow());

/* pixel logo */
(function logo(){const F={D:['11110','10001','10001','10001','10001','10001','11110'],E:['11111','10000','10000','11110','10000','10000','11111'],N:['10001','11001','11001','10101','10011','10011','10001'],
  S:['01111','10000','10000','01110','00001','00001','11110'],K:['10001','10010','10100','11000','10100','10010','10001'],T:['11111','00100','00100','00100','00100','00100','00100'],
  C:['01111','10000','10000','10000','10000','10000','01111'],H:['10001','10001','10001','11111','10001','10001','10001'],P:['11110','10001','10001','11110','10000','10000','10000'],A:['01110','10001','10001','11111','10001','10001','10001']};
  const c=$('#logo').getContext('2d');const px=2;let x=2;const put=(ch,col,y0,s)=>{const g=F[ch];for(let r=0;r<7;r++)for(let k=0;k<5;k++)if(g[r][k]==='1'){c.fillStyle='#000';c.fillRect(x+k*s+s/2,y0+r*s+s/2,s,s);c.fillStyle=col;c.fillRect(x+k*s,y0+r*s,s,s)}x+=6*s};
  for(const ch of'DEN')put(ch,'#f08a3c',4,3);x+=4;for(const ch of'SKETCHPAD')put(ch,'#f4ecdb',8,2)})();

/* ============================ boot ============================ */
(async function boot(){
  try{await DB.open()}catch(e){alert('Storage is not available: '+e.message);return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  audioSession('playback');ensureCtx();
  if(LS.get('drawer',false)){$('#drawer').classList.add('closed');$('#dToggle').textContent='SHOW'}
  const last=LS.get('last',null);let ok=false;if(last)ok=await openProject(last);
  if(!ok){const all=await DB.all('projects');if(all.length)ok=await openProject(all.sort((a,b)=>b.modified-a.modified)[0].id)}
  if(!ok){const p=newProject();await DB.put('projects',p);await openProjectObj(p)}
  resize();requestAnimationFrame(frame);
  // unlock audio on first touch (iOS)
  const unlock=()=>{ensureCtx();document.removeEventListener('pointerdown',unlock,true)};document.addEventListener('pointerdown',unlock,true);
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e))}
})();
</script>
